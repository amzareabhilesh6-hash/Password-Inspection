<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Inspection</title>
<style>
  :root {
    --bg: #0F1521;
    --panel: #161E2D;
    --line: #2A3345;
    --ink: #EDEEF0;
    --ink-dim: #8B95A8;
    --amber: #E8A33D;
    --teal: #4FD1C5;
    --coral: #F2545B;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --serif: 'Zilla Slab', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    padding: 48px 24px 80px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .sheet {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 28px;
    font-weight: 500;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }
  .sub {
    font-family: var(--mono);
    color: var(--ink-dim);
    font-size: 13px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .field {
    position: relative;
    border-bottom: 2px solid var(--line);
    margin-bottom: 28px;
    transition: border-color 0.25s ease;
  }
  .field.focused { border-bottom-color: var(--teal); }
  input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 20px;
    padding: 10px 40px 10px 0;
  }
  input::placeholder { color: #4A5468; }
  .toggle {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    padding: 6px;
  }
  .toggle:hover { color: var(--ink); }

  .gauge-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .verdict {
    font-size: 22px;
    font-weight: 500;
  }
  .crack-time {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
    text-align: right;
  }
  .crack-time b { color: var(--ink); font-weight: 500; }

  .gauge {
    height: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    gap: 2px;
    padding: 2px;
    margin-bottom: 40px;
  }
  .gauge .seg {
    flex: 1;
    background: var(--line);
    transition: background 0.3s ease;
  }
  .gauge .seg.lit { background: var(--fill, var(--teal)); }

  .ledger {
    border-top: 1px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .mark {
    font-family: var(--mono);
    font-size: 15px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
  }
  .mark.pass { color: var(--teal); border-color: var(--teal); }
  .mark.fail { color: var(--coral); border-color: var(--coral); }
  .mark.warn { color: var(--amber); border-color: var(--amber); }
  .desc {
    font-size: 15px;
    line-height: 1.4;
  }
  .desc .label { color: var(--ink); }
  .desc .detail { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .stat {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  .footnote {
    margin-top: 28px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.6;
  }
  .empty {
    padding: 60px 0;
    text-align: center;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="sheet">
  <h1>Password Inspection</h1>
  <p class="sub">Checked locally in your browser — nothing typed here is sent anywhere.</p>

  <div class="field" id="field">
    <input id="pw" type="password" placeholder="Type a password to inspect" autocomplete="off" spellcheck="false">
    <button class="toggle" id="toggle">SHOW</button>
  </div>

  <div id="results"></div>
</div>

<script>
const input = document.getElementById('pw');
const field = document.getElementById('field');
const toggle = document.getElementById('toggle');
const results = document.getElementById('results');

toggle.addEventListener('click', () => {
  input.type = input.type === 'password' ? 'text' : 'password';
  toggle.textContent = input.type === 'password' ? 'SHOW' : 'HIDE';
});
input.addEventListener('focus', () => field.classList.add('focused'));
input.addEventListener('blur', () => field.classList.remove('focused'));

const COMMON = new Set(["123456","password","123456789","12345678","12345","qwerty","abc123","111111","123123",
"password1","1234567","1234567890","1q2w3e4r","letmein","monkey","dragon","football","iloveyou","admin",
"welcome","login","master","sunshine","princess","qwertyuiop","000000","hello123","freedom","whatever",
"trustno1","superman","batman","starwars","zaq1zaq1","passw0rd","p@ssw0rd","charlie","donald","michael"]);

const KEYBOARD_ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm","1234567890"];

function hasSequential(pw) {
  const lower = pw.toLowerCase();
  for (let i = 0; i < lower.length - 2; i++) {
    const a = lower.charCodeAt(i), b = lower.charCodeAt(i+1), c = lower.charCodeAt(i+2);
    if (b === a + 1 && c === b + 1) return true;
    if (b === a - 1 && c === b - 1) return true;
  }
  return false;
}

function hasKeyboardRun(pw) {
  const lower = pw.toLowerCase();
  for (const row of KEYBOARD_ROWS) {
    for (let i = 0; i <= row.length - 3; i++) {
      const chunk = row.slice(i, i + 3);
      if (lower.includes(chunk) || lower.includes(chunk.split('').reverse().join(''))) return true;
    }
  }
  return false;
}

function hasRepeats(pw) {
  return /(.)\1\1/.test(pw);
}

function charsetSize(pw) {
  let size = 0;
  if (/[a-z]/.test(pw)) size += 26;
  if (/[A-Z]/.test(pw)) size += 26;
  if (/[0-9]/.test(pw)) size += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) size += 33;
  return size || 1;
}

function entropyBits(pw) {
  return pw.length * Math.log2(charsetSize(pw));
}

function formatCrackTime(bits) {
  // assume 10 billion guesses/sec (offline fast hash)
  const guesses = Math.pow(2, bits);
  const seconds = guesses / 1e10;
  const units = [
    [60, 'seconds'], [60, 'minutes'], [24, 'hours'], [365, 'days'],
    [100, 'years'], [10, 'centuries']
  ];
  if (seconds < 1) return 'instantly';
  let val = seconds;
  let unitName = 'seconds';
  for (const [factor, name] of units) {
    if (val < factor) { unitName = name; break; }
    val /= factor;
    unitName = name;
  }
  if (unitName === 'centuries' && val > 1000) return 'longer than the universe has existed';
  const rounded = val < 10 ? val.toFixed(1) : Math.round(val).toLocaleString();
  return `${rounded} ${unitName}`;
}

function analyze(pw) {
  const checks = [];

  checks.push({
    pass: pw.length >= 12,
    warn: pw.length >= 8 && pw.length < 12,
    label: pw.length >= 12 ? 'Long enough' : pw.length >= 8 ? 'A bit short' : 'Too short',
    detail: `${pw.length} characters — aim for 12 or more`
  });

  const varietyCount = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter(r => r.test(pw)).length;
  checks.push({
    pass: varietyCount >= 3,
    warn: varietyCount === 2,
    label: varietyCount >= 3 ? 'Good character mix' : varietyCount === 2 ? 'Limited variety' : 'Single character type',
    detail: `Uses ${varietyCount} of 4 types: lower, upper, digits, symbols`
  });

  const isCommon = COMMON.has(pw.toLowerCase());
  checks.push({
    pass: !isCommon,
    label: isCommon ? 'On breach lists' : 'Not a known common password',
    detail: isCommon ? 'This is one of the most-used passwords worldwide' : 'Not found in common leaked-password lists checked here'
  });

  const seq = hasSequential(pw) || hasKeyboardRun(pw);
  checks.push({
    pass: !seq,
    label: seq ? 'Predictable pattern' : 'No obvious sequences',
    detail: seq ? 'Contains a run like "abc", "123", or a keyboard row' : 'No sequential or keyboard-row runs detected'
  });

  const rep = hasRepeats(pw);
  checks.push({
    pass: !rep,
    label: rep ? 'Repeated characters' : 'No long repeats',
    detail: rep ? 'Same character repeated 3+ times in a row' : 'No excessive repetition found'
  });

  return checks;
}

function render() {
  const pw = input.value;
  if (!pw) {
    results.innerHTML = '<div class="empty">Waiting for input —</div>';
    return;
  }

  const checks = analyze(pw);
  const bits = entropyBits(pw);
  const failCount = checks.filter(c => !c.pass && !c.warn).length;
  const warnCount = checks.filter(c => c.warn).length;

  let score, verdictText, fillColor;
  if (COMMON.has(pw.toLowerCase()) || bits < 28) {
    score = 1; verdictText = 'Weak'; fillColor = 'var(--coral)';
  } else if (bits < 45 || failCount >= 1) {
    score = 2; verdictText = 'Fair'; fillColor = 'var(--amber)';
  } else if (bits < 65 || warnCount >= 1) {
    score = 3; verdictText = 'Good'; fillColor = 'var(--teal)';
  } else {
    score = 4; verdictText = 'Strong'; fillColor = 'var(--teal)';
  }

  const segments = [1,2,3,4].map(i =>
    `<div class="seg ${i <= score ? 'lit' : ''}" style="--fill:${fillColor}"></div>`
  ).join('');

  const rows = checks.map(c => {
    const cls = c.pass ? 'pass' : c.warn ? 'warn' : 'fail';
    const symbol = c.pass ? '✓' : c.warn ? '!' : '✕';
    return `
      <div class="row">
        <div class="mark ${cls}">${symbol}</div>
        <div class="desc">
          <span class="label">${c.label}</span>
          <span class="detail">${c.detail}</span>
        </div>
      </div>`;
  }).join('');

  results.innerHTML = `
    <div class="gauge-row">
      <div class="verdict" style="color:${fillColor}">${verdictText}</div>
      <div class="crack-time">Estimated crack time<br><b>${formatCrackTime(bits)}</b></div>
    </div>
    <div class="gauge">${segments}</div>
    <div class="ledger">${rows}</div>
    <p class="footnote">Entropy estimate: ~${bits.toFixed(0)} bits, assuming 10 billion guesses/second against an offline copy of a fast hash. Real-world crack time depends heavily on how the password is stored — a slow, salted hash (bcrypt, scrypt, Argon2) can push this out by orders of magnitude even for a weak password.</p>
  `;
}

input.addEventListener('input', render);
render();
</script>
</body>
</html>
